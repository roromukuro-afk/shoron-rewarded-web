services:
  - type: web
    name: shoron-screener-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shoron-screener-db
          property: connectionString
      - key: YFINANCE_ENABLED
        value: "true"
    healthCheckPath: /api/health

databases:
  - name: shoron-screener-db
    databaseName: screener
    user: screener
    plan: free
